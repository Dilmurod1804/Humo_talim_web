{% extends 'base.html' %}
{% block title %}Admin Kirish – HUMO O'quv Markazi{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="login-card">
            <!-- Logo inside card -->
            <div class="text-center mb-4">
                {% load static %}
                <img src="{% static 'img/humo_logo.jpg' %}" alt="HUMO Logo"
                     style="width:140px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.25);" class="mb-3">
                <p class="text-muted small">Boshqaruv tizimiga kirish</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 mb-4">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}

            <!-- ─── Google OAuth Button ──────────────────────────────────── -->
            <a href="{% url 'admin_google_start' %}" class="btn-google w-100 mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                     alt="Google" style="height:20px;">
                Google orqali kirish (OTP bilan)
            </a>

            <div class="d-flex align-items-center mb-4">
                <hr class="flex-grow-1 m-0" style="border-color:#e5e7eb;">
                <span class="px-3 text-muted small fw-semibold">YOKI PAROL BILAN</span>
                <hr class="flex-grow-1 m-0" style="border-color:#e5e7eb;">
            </div>

            <!-- ─── Standard Login ─────────────────────────────────────── -->
            <form method="post" action="{% url 'admin_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-dark">Login</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"
                              style="border:1.5px solid #e5e7eb;border-right:none;border-radius:10px 0 0 10px;">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" name="login" class="form-control border-start-0"
                               placeholder="admin"
                               style="border:1.5px solid #e5e7eb;border-left:none;border-radius:0 10px 10px 0;" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-dark">Parol</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"
                              style="border:1.5px solid #e5e7eb;border-right:none;border-radius:10px 0 0 10px;">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" class="form-control border-start-0"
                               placeholder="••••••••"
                               style="border:1.5px solid #e5e7eb;border-left:none;border-radius:0 10px 10px 0;" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end mb-4">
                    <a href="{% url 'forgot_password' %}" class="small text-decoration-none"
                       style="color:#667eea;font-weight:500;">Parolni unutdingizmi?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"
                        style="background:linear-gradient(135deg,#667eea,#764ba2);border:none;font-size:1rem;border-radius:12px;box-shadow:0 4px 15px rgba(102,126,234,.4);">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Tizimga Kirish
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
