{% extends 'base.html' %}
{% block title %}Parolni Tiklash - HUMO{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="login-card">
            <div class="text-center mb-4">
                <div style="background:linear-gradient(135deg,#f2994a,#f2c94c);border-radius:20px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 8px 25px rgba(242,153,74,0.35);">
                    <i class="bi bi-envelope-at-fill text-white" style="font-size:1.8rem;"></i>
                </div>
                <h3 class="fw-black text-dark mt-3 mb-1">Parolni Tiklash</h3>
                <p class="text-muted small">Admin emailingizga OTP kod yuboramiz</p>
            </div>
            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 mb-4">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-semibold small text-dark">Elektron pochta</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border:1.5px solid #e5e7eb;border-right:none;border-radius:10px 0 0 10px;">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="admin@gmail.com"
                               style="border:1.5px solid #e5e7eb;border-left:none;border-radius:0 10px 10px 0;" required>
                    </div>
                </div>
                <button type="submit" class="btn w-100 py-2 fw-bold text-white"
                        style="background:linear-gradient(135deg,#f2994a,#f2c94c);border:none;border-radius:12px;box-shadow:0 4px 15px rgba(242,153,74,0.35);">
                    <i class="bi bi-send-fill me-2"></i>Kod yuborish
                </button>
                <a href="{% url 'admin_login' %}" class="btn w-100 mt-2 btn-light fw-semibold" style="border-radius:10px;">Loginiga qaytish</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
